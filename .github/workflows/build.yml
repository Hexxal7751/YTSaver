name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android scaffolding (keeps our lib + pubspec)
        run: |
          cp -r lib /tmp/lib && cp pubspec.yaml /tmp/pubspec.yaml
          flutter create . --platforms=android --org dev.ytsaver --project-name ytsaver
          rm -rf lib test && cp -r /tmp/lib lib && cp /tmp/pubspec.yaml pubspec.yaml

      - name: Generate app icons from assets/logo.png
        run: |
          set -e
          test -f assets/logo.png || { echo "ERROR: assets/logo.png is missing"; exit 1; }
          command -v convert >/dev/null || sudo apt-get install -y imagemagick
          R=android/app/src/main/res
          make_icons() {
            d=$1; s=$2
            mkdir -p $R/mipmap-$d $R/drawable-$d
            fg=$((s*108/48)); inner=$((fg*62/100)); leg=$((s*92/100)); n=$((s/2))
            # adaptive icon foreground (logo kept inside the safe zone)
            convert assets/logo.png -trim +repage -resize ${inner}x${inner} -background none -gravity center -extent ${fg}x${fg} $R/mipmap-$d/ic_launcher_foreground.png
            # legacy launcher icon
            convert assets/logo.png -trim +repage -resize ${leg}x${leg} -background none -gravity center -extent ${s}x${s} $R/mipmap-$d/ic_launcher.png
            # white silhouette for notifications
            convert assets/logo.png -trim +repage -resize ${n}x${n} -background none -gravity center -extent ${n}x${n} -fill white -colorize 100 $R/drawable-$d/ic_stat_ytsaver.png
          }
          make_icons mdpi 48
          make_icons hdpi 72
          make_icons xhdpi 96
          make_icons xxhdpi 144
          make_icons xxxhdpi 192
          mkdir -p $R/mipmap-anydpi-v26 $R/values $R/raw
          cat > $R/mipmap-anydpi-v26/ic_launcher.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/ic_launcher_background"/>
            <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          XML
          cat > $R/values/ic_launcher_background.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <color name="ic_launcher_background">#FFFFFF</color>
          </resources>
          XML
          # stop release builds from stripping icons that are looked up by name
          cat > $R/raw/keep.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources xmlns:tools="http://schemas.android.com/tools"
              tools:keep="@drawable/ic_stat_ytsaver,@mipmap/ic_launcher,@mipmap/ic_launcher_foreground" />
          XML

      - name: Patch manifest, minSdk, desugaring, lint
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="[^"]*"/android:label="YTSaver"/' $M
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"/>\n    <application android:requestLegacyExternalStorage="true"#' $M
          sed -i 's#</application>#    <service android:name="com.pravera.flutter_foreground_task.service.ForegroundService" android:foregroundServiceType="dataSync" android:exported="false"/>\n    </application>#' $M
          # let YTSaver appear in the Android "Share" menu for text/links
          sed -i '0,/<\/activity>/{s#</activity>#    <intent-filter>\n                <action android:name="android.intent.action.SEND"/>\n                <category android:name="android.intent.category.DEFAULT"/>\n                <data android:mimeType="text/plain"/>\n            </intent-filter>\n        </activity>#}' $M
          G=android/app/build.gradle.kts
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' $G
          sed -i '/compileOptions {/a\        isCoreLibraryDesugaringEnabled = true' $G
          printf '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n' >> $G
          # skip the release lint check (crashes on some plugins, not needed for the APK)
          if [ -f android/build.gradle.kts ]; then
            printf '\nsubprojects {\n    tasks.whenTaskAdded {\n        if (name.startsWith("lintVital")) { enabled = false }\n    }\n}\n' >> android/build.gradle.kts
          fi
          cat $M

      - name: Add share-intent glue (MainActivity)
        run: |
          set -e
          F=$(find android/app/src/main -name 'MainActivity.*' | head -1)
          PKG=$(grep -m1 '^package ' "$F")
          DIR=$(dirname "$F")
          rm -f "$F"
          printf '%s\n\n' "$PKG" > "$DIR/MainActivity.kt"
          cat >> "$DIR/MainActivity.kt" <<'KOTLIN'
          import android.content.Intent
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterActivity() {
              private var channel: MethodChannel? = null
              private var pending: String? = null

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  val ch = MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "ytsaver/share")
                  ch.setMethodCallHandler { call, result ->
                      if (call.method == "getInitial") {
                          result.success(pending)
                          pending = null
                      } else {
                          result.notImplemented()
                      }
                  }
                  channel = ch
                  handleShare(intent, false)
              }

              override fun onNewIntent(intent: Intent) {
                  super.onNewIntent(intent)
                  setIntent(intent)
                  handleShare(intent, true)
              }

              private fun handleShare(i: Intent?, live: Boolean) {
                  if (i == null) return
                  if (i.action == Intent.ACTION_SEND && i.type == "text/plain") {
                      val text = i.getStringExtra(Intent.EXTRA_TEXT) ?: return
                      i.action = null
                      if (live) {
                          channel?.invokeMethod("shared", text)
                      } else {
                          pending = text
                      }
                  }
              }
          }
          KOTLIN
          cat "$DIR/MainActivity.kt" | head -5

      - run: flutter pub get
      - run: flutter build apk --release --target-platform android-arm64

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/YTSaver.apk

      - uses: actions/upload-artifact@v7
        with:
          name: YTSaver.apk
          path: build/app/outputs/flutter-apk/YTSaver.apk
          archive: false