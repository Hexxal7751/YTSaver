name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android scaffolding (keeps our lib + pubspec)
        run: |
          cp -r lib /tmp/lib && cp pubspec.yaml /tmp/pubspec.yaml
          flutter create . --platforms=android --org dev.ytsaver --project-name ytsaver
          rm -rf lib test && cp -r /tmp/lib lib && cp /tmp/pubspec.yaml pubspec.yaml

      - name: Patch manifest + minSdk
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28"/>\n    <application android:requestLegacyExternalStorage="true"#' $M
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' android/app/build.gradle.kts || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' android/app/build.gradle || true

      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: ytsaver-apk
          path: build/app/outputs/flutter-apk/*.apk
