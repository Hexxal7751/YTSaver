name: ytsaver
description: Open-source video downloader with full quality control.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  youtube_explode_dart: ^3.0.5
  ffmpeg_kit_flutter_new_min: ^3.6.3
  path_provider: ^2.1.4
  flutter_foreground_task: ^9.2.0
  flutter_local_notifications: ^18.0.1
  url_launcher: ^6.3.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png